[package]
name = "black-vault-desktop"
version = "0.2.0-rc.1"
description = "Offline encrypted vault and trusted contacts"
edition = "2024"
rust-version = "1.90"

[lib]
name = "black_vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "hkdfsha2", "aes"] }
keyring = "4.2.0"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2.12.0", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LABiometryType", "block2"] }
