[package]
name = "black-vault-desktop"
version = "0.1.0"
description = "Black Vault desktop foundation"
edition = "2024"
rust-version = "1.90"

[lib]
name = "black_vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2.12.0", features = ["test"] }
