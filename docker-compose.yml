services:
  postgres:
    image: postgres:17-alpine
    container_name: black-vault-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: black_vault_db
      POSTGRES_USER: black_vault
      POSTGRES_PASSWORD: black_vault_dev

    ports:
      - "5432:5432"

    volumes:
      - black-vault-postgres:/var/lib/postgresql/data

    networks:
      - black-vault-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U black_vault -d black_vault_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: black-vault-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://black_vault:black_vault_dev@postgres:5432/black_vault_db
      HOST: 0.0.0.0
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_for_testing_only_change_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./storage:/app/storage

    networks:
      - black-vault-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: black-vault-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - black-vault-frontend-node-modules:/app/node_modules
      - black-vault-frontend-next:/app/.next

    depends_on:
      - backend

    networks:
      - black-vault-network

networks:
  black-vault-network:
    name: black-vault-network
    driver: bridge

volumes:
  black-vault-postgres:
    name: black-vault-postgres

  black-vault-frontend-node-modules:
    name: black-vault-frontend-node-modules

  black-vault-frontend-next:
    name: black-vault-frontend-next
