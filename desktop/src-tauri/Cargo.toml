[package]
name = "black-vault-desktop"
version = "0.1.0"
description = "Black Vault desktop foundation"
edition = "2024"
rust-version = "1.90"

[lib]
name = "black_vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
tauri = { version = "2.12.0", features = ["test"] }
tempfile = "3"
